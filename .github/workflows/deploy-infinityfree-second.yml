name: Deploy GitHub Pages site to second InfinityFree account

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

jobs:
  deploy:
    name: Upload website to InfinityFree (second hosting)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Deploy files to second InfinityFree account
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_2 }}
          username: ${{ secrets.FTP_USERNAME_2 }}
          password: ${{ secrets.FTP_PASSWORD_2 }}
          protocol: ftp
          port: 21
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
